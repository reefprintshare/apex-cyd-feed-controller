apex_feed_c_url: "http://192.168.1.100/rest/status/feed/3"
apex_feed_d_url: "http://192.168.1.100/rest/status/feed/4"

# Apex local status endpoints used by later alert/countdown examples
apex_feed_status_url: "http://192.168.1.100/rest/status/feed"
apex_status_xml_url: "http://192.168.1.100/cgi-bin/status.xml"
