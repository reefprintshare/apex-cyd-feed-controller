# Poll the local Apex status endpoint and expose its outlet list as
# an attribute on sensor.apex_outlet_states.
#
# Required secrets.yaml entries:
#
# apex_username: "YOUR_APEX_USERNAME"
# apex_password: "YOUR_APEX_PASSWORD"
#
# Replace APEX_IP_ADDRESS with the local IP address or hostname of
# your own Apex controller. Keep this local to your LAN.

rest:
  - resource: "http://APEX_IP_ADDRESS/cgi-bin/status.xml"
    authentication: basic
    username: !secret apex_username
    password: !secret apex_password
    scan_interval: 5
    timeout: 5

    sensor:
      - name: "Apex Outlet States"
        unique_id: apex_outlet_states
        value_template: >-
          {{ value_json.status.outlets.outlet
             | selectattr('state', 'in', ['AON', 'ON'])
             | list
             | count }}
        json_attributes_path: "$.status.outlets"
        json_attributes:
          - outlet
