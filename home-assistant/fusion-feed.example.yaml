# Optional Home Assistant package:
# Fusion-style 15-minute feed mode with staged equipment restoration.
#
# Install as a Home Assistant package, or split the timer/script/automation
# sections into the matching areas of your own YAML configuration.
#
# Replace the example switch entity IDs below with your own.
#
# IMPORTANT:
# This example explicitly turns equipment ON during restore.
# It does NOT preserve arbitrary equipment states from before feed mode began.

timer:
  fusion_feed_15:
    name: Fusion Feed 15
    duration: "00:15:00"

script:
  fusion_15_start:
    alias: Fusion 15 - Start
    description: Turn off feed equipment and start the Fusion 15 timer.
    mode: single
    sequence:
      - action: switch.turn_off
        target:
          entity_id:
            - switch.return_pump
            - switch.uv_lamp
            - switch.skimmer
      - action: timer.start
        target:
          entity_id: timer.fusion_feed_15
        data:
          duration: "00:15:00"

  fusion_15_restore_equipment:
    alias: Fusion 15 - Restore Equipment
    description: Restore return and UV, wait one minute, then restore skimmer.
    mode: restart
    sequence:
      - action: switch.turn_on
        target:
          entity_id:
            - switch.return_pump
            - switch.uv_lamp
      - delay: "00:01:00"
      - action: switch.turn_on
        target:
          entity_id: switch.skimmer

  fusion_15_cancel:
    alias: Fusion 15 - Cancel
    description: Cancel the timer and restart the normal staged restore sequence.
    mode: single
    sequence:
      - action: timer.cancel
        target:
          entity_id: timer.fusion_feed_15
      - action: script.turn_off
        target:
          entity_id: script.fusion_15_restore_equipment
      - action: script.turn_on
        target:
          entity_id: script.fusion_15_restore_equipment

automation:
  - alias: Fusion 15 - Restore Equipment When Timer Finishes
    id: fusion_15_restore_equipment_when_timer_finishes
    description: Run the staged restore sequence when Fusion Feed ends naturally.
    mode: single
    triggers:
      - trigger: event
        event_type: timer.finished
        event_data:
          entity_id: timer.fusion_feed_15
    actions:
      - action: script.turn_on
        target:
          entity_id: script.fusion_15_restore_equipment
