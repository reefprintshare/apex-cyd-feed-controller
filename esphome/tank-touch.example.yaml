        "APEX CANCEL"
      );

      const bool touch_flash_active =
          (int32_t) (id(button_flash_until_ms) - millis()) > 0;

      if (touch_flash_active) {
        if (id(button_flash_action) == 1) {
          if (fusion_active) {
            it.filled_rectangle(5, 157, 152, 46, id(color_cancel_pressed_outline));
            it.filled_rectangle(8, 160, 146, 40, id(color_cancel_pressed_fill));
            it.rectangle(8, 160, 146, 40, id(color_cancel_pressed_outline));
            it.printf(
              81,
              172,
              id(font_button),
              id(color_cancel_pressed_text),
              TextAlign::TOP_CENTER,
              "FUSION CANCEL"
            );
          } else {
            it.filled_rectangle(5, 157, 152, 46, id(color_fusion_pressed_outline));
            it.filled_rectangle(8, 160, 146, 40, id(color_fusion_pressed_fill));
            it.rectangle(8, 160, 146, 40, id(color_fusion_pressed_outline));
            it.printf(
              81,
              172,
              id(font_button),
              id(color_fusion_pressed_text),
              TextAlign::TOP_CENTER,
              "FUSION 15"
            );
          }
        } else if (id(button_flash_action) == 2) {
          it.filled_rectangle(5, 61, 152, 46, id(color_apex_pressed_outline));
          it.filled_rectangle(8, 64, 146, 40, id(color_apex_pressed_fill));
          it.rectangle(8, 64, 146, 40, id(color_apex_pressed_outline));
          it.printf(
            81,
            76,
            id(font_button),
            id(color_apex_pressed_text),
            TextAlign::TOP_CENTER,
            "APEX A"
          );
        } else if (id(button_flash_action) == 3) {
          it.filled_rectangle(163, 61, 152, 46, id(color_apex_pressed_outline));
          it.filled_rectangle(166, 64, 146, 40, id(color_apex_pressed_fill));
          it.rectangle(166, 64, 146, 40, id(color_apex_pressed_outline));
          it.printf(
            239,
            76,
            id(font_button),
            id(color_apex_pressed_text),
            TextAlign::TOP_CENTER,
            "APEX B"
          );
        } else if (id(button_flash_action) == 4) {
          it.filled_rectangle(5, 109, 152, 46, id(color_apex_pressed_outline));
          it.filled_rectangle(8, 112, 146, 40, id(color_apex_pressed_fill));
          it.rectangle(8, 112, 146, 40, id(color_apex_pressed_outline));
          it.printf(
            81,
            124,
            id(font_button),
            id(color_apex_pressed_text),
            TextAlign::TOP_CENTER,
            "APEX C"
          );
        } else if (id(button_flash_action) == 5) {
          it.filled_rectangle(163, 109, 152, 46, id(color_apex_pressed_outline));
          it.filled_rectangle(166, 112, 146, 40, id(color_apex_pressed_fill));
          it.rectangle(166, 112, 146, 40, id(color_apex_pressed_outline));
          it.printf(
            239,
            124,
            id(font_button),
            id(color_apex_pressed_text),
            TextAlign::TOP_CENTER,
            "APEX D"
          );
        } else if (id(button_flash_action) == 6) {
          it.filled_rectangle(163, 157, 152, 46, id(color_cancel_pressed_outline));
          it.filled_rectangle(166, 160, 146, 40, id(color_cancel_pressed_fill));
          it.rectangle(166, 160, 146, 40, id(color_cancel_pressed_outline));
          it.printf(
            239,
            172,
            id(font_button),
            id(color_cancel_pressed_text),
            TextAlign::TOP_CENTER,
            "APEX CANCEL"
          );
        }
      }

      if (!show_alert) {
        it.filled_rectangle(0, 206, 320, 34, id(color_idle_footer_fill));
        it.rectangle(0, 206, 320, 34, id(color_idle_footer_border));

        if (id(status_message).empty()) {
          it.printf(
            160,
            223,
            id(font_message),
            id(color_idle_footer_text),
            TextAlign::CENTER,
            "SELECT FEED ACTION"
          );
        } else {
          it.printf(
            160,
            223,
            id(font_message),
            id(color_footer_sent),
            TextAlign::CENTER,
            "%s",
            id(status_message).c_str()
          );
        }
      }

      const bool footer_visible =
          alert_is_info ||
          alert_is_blue ||
          blink_visible;

      if (show_alert && footer_visible) {
        if (alert_is_alarm) {
          it.filled_rectangle(0, 206, 320, 34, id(color_alert_red));
          it.rectangle(0, 206, 320, 34, id(color_cancel_outline));
        } else if (alert_is_warning) {
          it.filled_rectangle(0, 206, 320, 34, id(color_alert_amber));
          it.rectangle(0, 206, 320, 34, id(color_apex_outline));
        } else if (alert_is_blue) {
          it.filled_rectangle(0, 206, 320, 34, id(color_alert_blue));
          it.rectangle(0, 206, 320, 34, id(color_fusion_outline));
        } else {
          it.filled_rectangle(0, 206, 320, 34, id(color_alert_green));
          it.rectangle(0, 206, 320, 34, id(color_footer_sent));
        }

        it.printf(
          160,
          223,
          id(font_button),
          id(color_white_text),
          TextAlign::CENTER,
          "%s",
          alert_line
        );
      }

touchscreen:
  - platform: xpt2046
    id: cyd_touch
    spi_id: touch_spi
    cs_pin: GPIO33
    interrupt_pin: GPIO36
    update_interval: 50ms
    threshold: 400
    calibration:
      x_min: 280
      x_max: 3860
      y_min: 340
      y_max: 3860

    on_touch:
      - if:
          condition:
            lambda: 'return !id(touch_latched);'
          then:
            - lambda: |-
                id(touch_latched) = true;
                id(touch_action) = 0;

                auto now = id(ha_time).now();
                bool night_mode = false;

                if (now.is_valid()) {
                  int minutes_now = now.hour * 60 + now.minute;

                  night_mode =
                      minutes_now >= (23 * 60) ||
                      minutes_now < (10 * 60);
                }

                if (night_mode) {
                  id(screen_wake_until_ms) = millis() + 60000;
                }

                if (id(screen_is_dim)) {
                  id(screen_is_dim) = false;
                  id(touch_action) = 99;

                  auto call = id(screen_backlight).turn_on();
                  call.set_brightness(1.0f);
                  call.perform();

                  return;
                }

                int px = (touch.y_raw - 530) * 320 / (3294 - 530);
                int py = (touch.x_raw - 736) * 240 / (3348 - 736);

                if (px < 0) px = 0;
                if (px > 319) px = 319;
                if (py < 0) py = 0;
                if (py > 239) py = 239;

                ESP_LOGI(
                  "feed_control",
                  "Touch raw=%d,%d mapped=%d,%d",
                  touch.x_raw,
                  touch.y_raw,
                  px,
                  py
                );

                if (py >= 60 && py <= 108) {
                  if (px >= 0 && px <= 160) {
                    id(touch_action) = 2;
                  } else if (px >= 160 && px <= 319) {
                    id(touch_action) = 3;
                  }

                } else if (py >= 108 && py <= 156) {
                  if (px >= 0 && px <= 160) {
                    id(touch_action) = 4;
                  } else if (px >= 160 && px <= 319) {
                    id(touch_action) = 5;
                  }

                } else if (py >= 156 && py <= 206) {
                  if (px >= 0 && px <= 160) {
                    id(touch_action) = 1;
                  } else if (px >= 160 && px <= 319) {
                    id(touch_action) = 6;
                  }
                }

                if (id(touch_action) >= 1 &&
                    id(touch_action) <= 6) {
                  id(button_flash_action) = id(touch_action);
                  id(button_flash_until_ms) = millis() + 350;
                }

            - if:
                condition:
                  lambda: |-
                    return id(touch_action) == 1 &&
                           id(fusion_feed_15_state).state == "active";
                then:
                  - script.execute: run_fusion_cancel

            - if:
                condition:
                  lambda: |-
                    return id(touch_action) == 1 &&
                           id(fusion_feed_15_state).state != "active";
                then:
                  - script.execute: run_fusion_feed_15

            - if:
                condition:
                  lambda: 'return id(touch_action) == 2;'
                then:
                  - script.execute: run_apex_feed_a

            - if:
                condition:
                  lambda: 'return id(touch_action) == 3;'
                then:
                  - script.execute: run_apex_feed_b

            - if:
                condition:
                  lambda: 'return id(touch_action) == 4;'
                then:
                  - script.execute: run_apex_feed_c

            - if:
                condition:
                  lambda: 'return id(touch_action) == 5;'
                then:
                  - script.execute: run_apex_feed_d

            - if:
                condition:
                  lambda: 'return id(touch_action) == 6;'
                then:
                  - script.execute: run_apex_cancel

    on_release:
      - lambda: |-
          id(touch_latched) = false;
