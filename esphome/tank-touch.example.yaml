# DIY Apex CYD Feed Controller & Status Display — v0.2.0 example
#
# Hardware: ESP32-2432S028 CYD, 320 x 240 landscape display
#
# Before flashing:
# 1. Copy secrets.example.yaml to a private secrets.yaml file.
# 2. Add Wi-Fi credentials, api_encryption_key, and ota_password.
# 3. Update Home Assistant entity IDs below to match your setup.
# 4. Verify touch calibration values for your individual CYD.
#
# This public example intentionally excludes all private IP addresses,
# hostnames, Wi-Fi details, credentials, and static-address settings.
#
# Required Home Assistant entities are documented in the repository.

esphome:
  name: apex-cyd-feed-panel
  friendly_name: Apex Feed Panel

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

time:
  - platform: homeassistant
    id: ha_time

spi:
  - id: tft_spi
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12

  - id: touch_spi
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

output:
  - platform: ledc
    pin: GPIO21
    id: backlight_pwm

light:
  - platform: monochromatic
    id: screen_backlight
    output: backlight_pwm
    restore_mode: ALWAYS_ON

font:
  - file: "gfonts://Roboto"
    id: font_title
    size: 19

  - file: "gfonts://Roboto"
    id: font_header_side
    size: 12

  - file: "gfonts://Roboto"
    id: font_status
    size: 12

  - file: "gfonts://Roboto@700"
    id: font_button
    size: 15

  - file: "gfonts://Roboto"
    id: font_message
    size: 11

color:
  - id: color_bg
    hex: "080A0D"

  - id: color_header
    hex: "F57C00"

  - id: color_header_top_highlight
    hex: "FFB74D"

  - id: color_header_bottom_edge
    hex: "B84D00"

  - id: color_header_title_shadow
    hex: "6B2C00"

  - id: color_fusion_button
    hex: "1976D2"

  - id: color_fusion_outline
    hex: "64B5F6"

  - id: color_fusion_border
    hex: "0A4F8A"

  - id: color_fusion_pressed_fill
    hex: "0A4F8A"

  - id: color_fusion_pressed_outline
    hex: "64B5F6"

  - id: color_fusion_pressed_text
    hex: "E3F2FD"

  - id: color_apex_button
    hex: "F59E0B"

  - id: color_apex_outline
    hex: "FFD166"

  - id: color_apex_border
    hex: "B85F00"

  - id: color_apex_active_button
    hex: "C96A00"

  - id: color_apex_active_outline
    hex: "F59E0B"

  - id: color_apex_active_text
    hex: "FFF3CD"

  - id: color_apex_pressed_fill
    hex: "C96A00"

  - id: color_apex_pressed_outline
    hex: "FFD166"

  - id: color_apex_pressed_text
    hex: "FFF3CD"

  - id: color_cancel
    hex: "C62828"

  - id: color_cancel_outline
    hex: "EF5350"

  - id: color_cancel_border
    hex: "8E1E1E"

  - id: color_cancel_pressed_fill
    hex: "8E1E1E"

  - id: color_cancel_pressed_outline
    hex: "EF5350"

  - id: color_cancel_pressed_text
    hex: "FFEBEE"

  - id: color_white_text
    hex: "FFFFFF"

  - id: color_black_text
    hex: "111111"

  - id: color_fusion_status
    hex: "64B5F6"

  - id: color_apex_status
    hex: "FFD166"

  - id: color_footer_sent
    hex: "66D98A"

  - id: color_idle_footer_fill
    hex: "10161D"

  - id: color_idle_footer_border
    hex: "29414F"

  - id: color_idle_footer_text
    hex: "D7E1E8"

  - id: color_alert_red
    hex: "C62828"

  - id: color_alert_amber
    hex: "F9A825"

  - id: color_alert_green
    hex: "2E7D32"

  - id: color_alert_blue
    hex: "1976D2"

globals:
  - id: apex_feed_number_local
    type: int
    restore_value: no
    initial_value: '0'

  - id: apex_remaining_local
    type: int
    restore_value: no
    initial_value: '0'

  - id: fusion_ha_last_update_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: screen_wake_until_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: screen_is_dim
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: priority_alert_active
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: button_flash_action
    type: int
    restore_value: no
    initial_value: '0'

  - id: button_flash_until_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: touch_latched
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: touch_action
    type: int
    restore_value: no
    initial_value: '0'

  - id: status_message
    type: std::string
    restore_value: no
    initial_value: '""'

  - id: alert_index
    type: int
    restore_value: no
    initial_value: '0'

sensor:
  - platform: wifi_signal
    id: wifi_signal_dbm
    internal: true
    update_interval: 10s

  - platform: homeassistant
    id: apex_feed_number
    entity_id: sensor.apex_feed_status
    internal: true
    on_value:
      then:
        - lambda: |-
            id(apex_feed_number_local) = (int) roundf(x);

            if (id(apex_feed_number_local) == 0) {
              id(apex_remaining_local) = 0;
            }

  - platform: homeassistant
    id: apex_feed_remaining
    entity_id: sensor.apex_feed_status
    attribute: active
    internal: true
    on_value:
      then:
        - lambda: |-
            id(apex_remaining_local) = (int) roundf(x);

  - platform: homeassistant
    id: apex_feed_status_age
    entity_id: sensor.apex_feed_status_age
    internal: true

  - platform: homeassistant
    id: tank_touch_heartbeat
    entity_id: sensor.apex_cyd_heartbeat
    internal: true
    on_value:
      then:
        - lambda: |-
            id(fusion_ha_last_update_ms) = millis();

  - platform: homeassistant
    id: fusion_feed_remaining_seconds
    entity_id: sensor.fusion_feed_15_remaining_seconds
    internal: true

  - platform: homeassistant
    id: fusion_restore_remaining_seconds
    entity_id: sensor.fusion_15_restore_remaining_seconds
    internal: true

text_sensor:
  - platform: homeassistant
    id: fusion_feed_15_state
    entity_id: timer.fusion_feed_15
    internal: true

  - platform: homeassistant
    id: fusion_restore_state
    entity_id: script.fusion_15_restore_equipment
    internal: true

  - platform: homeassistant
    id: apex_cyd_alerts
    entity_id: sensor.apex_cyd_alerts
    internal: true
    on_value:
      then:
        - lambda: |-
            id(alert_index) = 0;

            id(priority_alert_active) =
                x.find("A:") != std::string::npos ||
                x.find("W:") != std::string::npos;

interval:
  - interval: 1s
    then:
      - lambda: |-
          if (id(apex_remaining_local) > 0) {
            id(apex_remaining_local)--;

            if (id(apex_remaining_local) <= 0) {
              id(apex_remaining_local) = 0;
              id(apex_feed_number_local) = 0;
            }
          }

          auto now = id(ha_time).now();
          bool night_mode = false;

          if (now.is_valid()) {
            int minutes_now = now.hour * 60 + now.minute;

            night_mode =
                minutes_now >= (23 * 60) ||
                minutes_now < (10 * 60);
          }

          const bool wake_active =
              (int32_t) (id(screen_wake_until_ms) - millis()) > 0;

          const bool should_dim =
              night_mode &&
              !wake_active &&
              !id(priority_alert_active);

          if (should_dim != id(screen_is_dim)) {
            id(screen_is_dim) = should_dim;

            auto call = id(screen_backlight).turn_on();
            call.set_brightness(should_dim ? 0.20f : 1.0f);
            call.perform();
          }

  - interval: 4s
    then:
      - lambda: |-
          const std::string alerts = id(apex_cyd_alerts).state;

          if (alerts.empty() || alerts == "NORMAL") {
            id(alert_index) = 0;
            return;
          }

          int count = 1;
          bool has_priority_item = false;
          size_t start = 0;

          while (true) {
            size_t end = alerts.find('|', start);
            std::string entry;

            if (end == std::string::npos) {
              entry = alerts.substr(start);
            } else {
              entry = alerts.substr(start, end - start);
            }

            if (entry.rfind("A:", 0) == 0 ||
                entry.rfind("W:", 0) == 0) {
              has_priority_item = true;
            }

            if (end == std::string::npos) {
              break;
            }

            count++;
            start = end + 1;
          }

          if (has_priority_item) {
            id(alert_index) = 0;
            return;
          }

          if (count > 1) {
            id(alert_index) = (id(alert_index) + 1) % count;
          } else {
            id(alert_index) = 0;
          }

script:
  - id: run_fusion_feed_15
    mode: single
    then:
      - lambda: |-
          id(status_message) = "FUSION 15 SENT";
      - homeassistant.action:
          action: script.turn_on
          data:
            entity_id: script.fusion_15_start
      - delay: 1500ms
      - lambda: |-
          id(status_message) = "";

  - id: run_fusion_cancel
    mode: single
    then:
      - lambda: |-
          id(status_message) = "FUSION CANCEL SENT";
      - homeassistant.action:
          action: script.turn_on
          data:
            entity_id: script.fusion_15_cancel
      - delay: 1500ms
      - lambda: |-
          id(status_message) = "";

  - id: run_apex_feed_a
    mode: single
    then:
      - lambda: |-
          id(status_message) = "APEX A SENT";
      - homeassistant.action:
          action: rest_command.apex_feed_a
      - delay: 1500ms
      - lambda: |-
          id(status_message) = "";

  - id: run_apex_feed_b
    mode: single
    then:
      - lambda: |-
          id(status_message) = "APEX B SENT";
      - homeassistant.action:
          action: rest_command.apex_feed_b
      - delay: 1500ms
      - lambda: |-
          id(status_message) = "";

  - id: run_apex_feed_c
    mode: single
    then:
      - lambda: |-
          id(status_message) = "APEX C SENT";
      - homeassistant.action:
          action: rest_command.apex_feed_c
      - delay: 1500ms
      - lambda: |-
          id(status_message) = "";

  - id: run_apex_feed_d
    mode: single
    then:
      - lambda: |-
          id(status_message) = "APEX D SENT";
      - homeassistant.action:
          action: rest_command.apex_feed_d
      - delay: 1500ms
      - lambda: |-
          id(status_message) = "";

  - id: run_apex_cancel
    mode: single
    then:
      - lambda: |-
          id(status_message) = "APEX CANCEL SENT";
      - homeassistant.action:
          action: rest_command.apex_cancel
      - delay: 1500ms
      - lambda: |-
          id(status_message) = "";

display:
  - platform: mipi_spi
    id: cyd_display
    model: ST7789V
    spi_id: tft_spi
    cs_pin:
      number: GPIO15
      ignore_strapping_warning: true
    dc_pin:
      number: GPIO2
      ignore_strapping_warning: true
    dimensions:
      width: 240
      height: 320
    rotation: 90
    invert_colors: false
    update_interval: 250ms
    lambda: |-
      char fusion_line[32];
      char apex_line[32];
      char alert_line[96];

      const bool fusion_active =
          id(fusion_feed_15_state).state == "active";

      const bool fusion_restoring =
          id(fusion_restore_state).state == "on";

      const bool apex_feed_active =
          id(apex_feed_number_local) > 0 &&
          id(apex_remaining_local) > 0;

      const float apex_data_age =
          id(apex_feed_status_age).state;

      const bool apex_data_is_valid =
          !isnan(apex_data_age);

      const bool apex_data_fresh =
          apex_data_is_valid &&
          apex_data_age <= 15;

      const bool apex_data_delayed =
          apex_data_is_valid &&
          apex_data_age > 15 &&
          apex_data_age <= 30;

      const uint32_t fusion_ha_age_ms =
          id(fusion_ha_last_update_ms) == 0
            ? 999999
            : (uint32_t) (millis() - id(fusion_ha_last_update_ms));

      const bool fusion_ha_fresh =
          fusion_ha_age_ms <= 15000;

      const bool fusion_ha_delayed =
          fusion_ha_age_ms > 15000 &&
          fusion_ha_age_ms <= 30000;

      const float wifi_dbm =
          id(wifi_signal_dbm).state;

      const bool wifi_valid =
          !isnan(wifi_dbm);

      int wifi_bars = 0;

      if (wifi_valid) {
        if (wifi_dbm >= -55) {
          wifi_bars = 4;
        } else if (wifi_dbm >= -65) {
          wifi_bars = 3;
        } else if (wifi_dbm >= -75) {
          wifi_bars = 2;
        } else {
          wifi_bars = 1;
        }
      }

      if (fusion_restoring) {
        if (!isnan(id(fusion_restore_remaining_seconds).state) &&
            id(fusion_restore_remaining_seconds).state > 0) {
          int remaining =
              (int) roundf(id(fusion_restore_remaining_seconds).state);

          int mins = remaining / 60;
          int secs = remaining % 60;

          snprintf(
            fusion_line,
            sizeof(fusion_line),
            "SKIMMER IN %d:%02d",
            mins,
            secs
          );
        } else {
          snprintf(
            fusion_line,
            sizeof(fusion_line),
            "FUSION RESTORING"
          );
        }
      } else if (fusion_active &&
                 !isnan(id(fusion_feed_remaining_seconds).state) &&
                 id(fusion_feed_remaining_seconds).state > 0) {
        int remaining =
            (int) roundf(id(fusion_feed_remaining_seconds).state);

        int mins = remaining / 60;
        int secs = remaining % 60;

        snprintf(
          fusion_line,
          sizeof(fusion_line),
          "FUSION %d:%02d",
          mins,
          secs
        );
      } else {
        snprintf(
          fusion_line,
          sizeof(fusion_line),
          "FUSION READY"
        );
      }

      if (apex_feed_active) {
        int mins = id(apex_remaining_local) / 60;
        int secs = id(apex_remaining_local) % 60;

        char feed_char = '?';

        if (id(apex_feed_number_local) >= 1 &&
            id(apex_feed_number_local) <= 4) {
          feed_char = 'A' + (id(apex_feed_number_local) - 1);
        }

        snprintf(
          apex_line,
          sizeof(apex_line),
          "APEX %c %d:%02d",
          feed_char,
          mins,
          secs
        );
      } else {
        snprintf(
          apex_line,
          sizeof(apex_line),
          "APEX READY"
        );
      }

      const std::string alerts = id(apex_cyd_alerts).state;

      int alert_count = 0;
      int selected_index = 0;
      int first_alarm_index = -1;
      int first_warning_index = -1;
      bool priority_locked = false;
      std::string selected_entry = "";

      if (!alerts.empty() && alerts != "NORMAL") {
        alert_count = 1;
        int current_index = 0;
        size_t scan_start = 0;

        while (true) {
          size_t scan_end = alerts.find('|', scan_start);
          std::string entry;

          if (scan_end == std::string::npos) {
            entry = alerts.substr(scan_start);
          } else {
            entry = alerts.substr(scan_start, scan_end - scan_start);
          }

          if (entry.rfind("A:", 0) == 0 &&
              first_alarm_index == -1) {
            first_alarm_index = current_index;
          }

          if (entry.rfind("W:", 0) == 0 &&
              first_warning_index == -1) {
            first_warning_index = current_index;
          }

          if (scan_end == std::string::npos) {
            break;
          }

          alert_count++;
          current_index++;
          scan_start = scan_end + 1;
        }

        if (first_alarm_index >= 0) {
          selected_index = first_alarm_index;
          priority_locked = true;
        } else if (first_warning_index >= 0) {
          selected_index = first_warning_index;
          priority_locked = true;
        } else {
          selected_index = id(alert_index) % alert_count;
        }

        size_t start = 0;

        for (int i = 0; i < selected_index; i++) {
          size_t separator = alerts.find('|', start);

          if (separator == std::string::npos) {
            start = 0;
            selected_index = 0;
            break;
          }

          start = separator + 1;
        }

        size_t end = alerts.find('|', start);

        if (end == std::string::npos) {
          selected_entry = alerts.substr(start);
        } else {
          selected_entry = alerts.substr(start, end - start);
        }
      }

      const bool alert_is_alarm =
          selected_entry.rfind("A:", 0) == 0;

      const bool alert_is_info =
          selected_entry.rfind("I:", 0) == 0;

      const bool alert_is_blue =
          selected_entry.rfind("B:", 0) == 0;

      const bool alert_is_warning =
          selected_entry.rfind("W:", 0) == 0;

      const bool show_alert =
          alert_is_alarm ||
          alert_is_info ||
          alert_is_blue ||
          alert_is_warning;

      const bool blink_visible =
          ((millis() / 1000) % 2) == 0;

      std::string alert_text = "";

      if (show_alert && selected_entry.length() > 2) {
        alert_text = selected_entry.substr(2);
      }

      if (show_alert) {
        if (!priority_locked && alert_count > 1) {
          snprintf(
            alert_line,
            sizeof(alert_line),
            "%s  %d/%d",
            alert_text.c_str(),
            selected_index + 1,
            alert_count
          );
        } else {
          snprintf(
            alert_line,
            sizeof(alert_line),
            "%s",
            alert_text.c_str()
          );
        }
      } else {
        snprintf(
          alert_line,
          sizeof(alert_line),
          ""
        );
      }

      it.fill(id(color_bg));

      it.filled_rectangle(0, 0, 320, 30, id(color_header));
      it.filled_rectangle(0, 0, 320, 2, id(color_header_top_highlight));
      it.filled_rectangle(0, 28, 320, 2, id(color_header_bottom_edge));
      it.filled_rectangle(0, 0, 2, 30, id(color_header_bottom_edge));
      it.filled_rectangle(318, 0, 2, 30, id(color_header_bottom_edge));

      auto now = id(ha_time).now();

      if (now.is_valid()) {
        it.strftime(
          8,
          15,
          id(font_header_side),
          id(color_black_text),
          TextAlign::CENTER_LEFT,
          "%a %b %d",
          now
        );

        it.strftime(
          312,
          15,
          id(font_header_side),
          id(color_black_text),
          TextAlign::CENTER_RIGHT,
          "%I:%M %p",
          now
        );
      }

      it.printf(
        161,
        16,
        id(font_title),
        id(color_header_title_shadow),
        TextAlign::CENTER,
        "FEED CONTROL"
      );

      it.printf(
        160,
        15,
        id(font_title),
        id(color_white_text),
        TextAlign::CENTER,
        "FEED CONTROL"
      );

      it.printf(
        160,
        35,
        id(font_status),
        id(color_apex_status),
        TextAlign::TOP_CENTER,
        "%s",
        apex_line
      );

      it.printf(
        160,
        48,
        id(font_status),
        id(color_fusion_status),
        TextAlign::TOP_CENTER,
        "%s",
        fusion_line
      );

      if (wifi_bars >= 3) {
        if (wifi_bars >= 1) {
          it.filled_rectangle(8, 49, 3, 3, id(color_footer_sent));
        }
        if (wifi_bars >= 2) {
          it.filled_rectangle(13, 47, 3, 5, id(color_footer_sent));
        }
        if (wifi_bars >= 3) {
          it.filled_rectangle(18, 45, 3, 7, id(color_footer_sent));
        }
        if (wifi_bars >= 4) {
          it.filled_rectangle(23, 43, 3, 9, id(color_footer_sent));
        }
      } else if (wifi_bars == 2) {
        it.filled_rectangle(8, 49, 3, 3, id(color_alert_amber));
        it.filled_rectangle(13, 47, 3, 5, id(color_alert_amber));
      } else {
        it.filled_rectangle(8, 49, 3, 3, id(color_alert_red));
      }

      if (apex_data_fresh) {
        it.filled_rectangle(304, 39, 4, 4, id(color_footer_sent));
      } else if (apex_data_delayed) {
        it.filled_rectangle(304, 39, 4, 4, id(color_alert_amber));
      } else {
        it.filled_rectangle(304, 39, 4, 4, id(color_alert_red));
      }

      if (fusion_ha_fresh) {
        it.filled_rectangle(304, 52, 4, 4, id(color_footer_sent));
      } else if (fusion_ha_delayed) {
        it.filled_rectangle(304, 52, 4, 4, id(color_alert_amber));
      } else {
        it.filled_rectangle(304, 52, 4, 4, id(color_alert_red));
      }

      const bool apex_a_active =
          apex_feed_active &&
          id(apex_feed_number_local) == 1;

      const bool apex_b_active =
          apex_feed_active &&
          id(apex_feed_number_local) == 2;

      const bool apex_c_active =
          apex_feed_active &&
          id(apex_feed_number_local) == 3;

      const bool apex_d_active =
          apex_feed_active &&
          id(apex_feed_number_local) == 4;

      if (apex_a_active) {
        it.filled_rectangle(5, 61, 152, 46, id(color_apex_active_outline));
        it.filled_rectangle(8, 64, 146, 40, id(color_apex_active_button));
        it.rectangle(8, 64, 146, 40, id(color_apex_active_outline));
        it.printf(
          81,
          76,
          id(font_button),
          id(color_apex_active_text),
          TextAlign::TOP_CENTER,
          "APEX A"
        );
      } else {
        it.filled_rectangle(5, 61, 152, 46, id(color_apex_border));
        it.filled_rectangle(8, 64, 146, 40, id(color_apex_button));
        it.rectangle(8, 64, 146, 40, id(color_apex_outline));
        it.printf(
          81,
          76,
          id(font_button),
          id(color_black_text),
          TextAlign::TOP_CENTER,
          "APEX A"
        );
      }

      if (apex_b_active) {
        it.filled_rectangle(163, 61, 152, 46, id(color_apex_active_outline));
        it.filled_rectangle(166, 64, 146, 40, id(color_apex_active_button));
