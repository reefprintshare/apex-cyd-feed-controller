        it.filled_rectangle(8, 112, 146, 40, id(color_apex_button));
        it.rectangle(8, 112, 146, 40, id(color_apex_outline));
        it.printf(
          81,
          124,
          id(font_button),
          id(color_black_text),
          TextAlign::TOP_CENTER,
          "APEX C"
        );
      }

      if (apex_d_active) {
        it.filled_rectangle(163, 109, 152, 46, id(color_apex_active_outline));
        it.filled_rectangle(166, 112, 146, 40, id(color_apex_active_button));
        it.rectangle(166, 112, 146, 40, id(color_apex_active_outline));
        it.printf(
          239,
          124,
          id(font_button),
          id(color_apex_active_text),
          TextAlign::TOP_CENTER,
          "APEX D"
        );
      } else {
        it.filled_rectangle(163, 109, 152, 46, id(color_apex_border));
        it.filled_rectangle(166, 112, 146, 40, id(color_apex_button));
        it.rectangle(166, 112, 146, 40, id(color_apex_outline));
        it.printf(
          239,
          124,
          id(font_button),
          id(color_black_text),
          TextAlign::TOP_CENTER,
          "APEX D"
        );
      }

      if (fusion_active) {
        it.filled_rectangle(5, 157, 152, 46, id(color_cancel_border));
        it.filled_rectangle(8, 160, 146, 40, id(color_cancel));
        it.rectangle(8, 160, 146, 40, id(color_cancel_outline));
        it.printf(
          81,
          172,
          id(font_button),
          id(color_black_text),
          TextAlign::TOP_CENTER,
          "FUSION CANCEL"
        );
      } else {
        it.filled_rectangle(5, 157, 152, 46, id(color_fusion_border));
        it.filled_rectangle(8, 160, 146, 40, id(color_fusion_button));
        it.rectangle(8, 160, 146, 40, id(color_fusion_outline));
        it.printf(
          81,
          172,
          id(font_button),
          id(color_black_text),
          TextAlign::TOP_CENTER,
          "FUSION 15"
        );
      }

      it.filled_rectangle(163, 157, 152, 46, id(color_cancel_border));
      it.filled_rectangle(166, 160, 146, 40, id(color_cancel));
      it.rectangle(166, 160, 146, 40, id(color_cancel_outline));
