# Generate a unique encrypted API key for your own ESPHome device.
api_encryption_key: "YOUR_GENERATED_API_ENCRYPTION_KEY"

# Use a strong password for over-the-air firmware updates.
ota_password: "YOUR_OTA_PASSWORD"
